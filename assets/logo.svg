<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" opacity="0.1" stroke="url(#gradient)" stroke-width="2"/>
  
  <!-- Central node -->
  <circle cx="64" cy="64" r="12" fill="url(#gradient)"/>
  
  <!-- Top node -->
  <circle cx="64" cy="30" r="8" fill="url(#gradient)"/>
  
  <!-- Bottom-left node -->
  <circle cx="35" cy="88" r="8" fill="url(#gradient)"/>
  
  <!-- Bottom-right node -->
  <circle cx="93" cy="88" r="8" fill="url(#gradient)"/>
  
  <!-- Connection lines -->
  <line x1="64" y1="76" x2="64" y2="38" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="76" x2="43" y2="80" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="76" x2="85" y2="80" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
</svg>
